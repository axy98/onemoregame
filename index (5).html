<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e60012">
<title>Juegos Diarios</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#111114;--mu:#6e6e78;--ac:#e60012;--bd:rgba(0,0,0,.08);--bar:rgba(255,255,255,.85)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c20;--tx:#f5f5f7;--mu:#98989f;--bd:rgba(255,255,255,.1);--bar:rgba(20,20,24,.85)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 120px}
button{font:inherit;color:inherit;border:0;cursor:pointer}button:active{transform:scale(.97)}
.dt{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
h1{font-size:34px;margin:2px 0 6px;letter-spacing:-.02em}
.intro{color:var(--mu);line-height:1.45;margin:0 0 18px;font-size:15px}
.hero{background:var(--card);border-radius:26px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.cv{position:relative;background:#444 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.cv.big{height:300px;align-items:flex-end}
.cv.big .ti{width:100%;padding:60px 20px 16px;background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:27px;font-weight:800;line-height:1.15}
.cv.sm{width:76px;height:52px;border-radius:12px;font-size:24px}
.hb{padding:16px 18px 18px}
.chip{display:inline-block;font-size:12px;font-weight:600;background:var(--bg);padding:4px 11px;border-radius:20px;margin:0 6px 6px 0}
.hb p{font-size:15px;line-height:1.55;margin:8px 0 16px}.hb small{color:var(--mu);display:block;margin:-8px 0 14px}
.btn{width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;background:var(--ac);color:#fff;margin-bottom:10px}
.r2{display:flex;gap:8px}.r2 .btn{flex:1;background:var(--bg);color:var(--tx);font-size:14px;font-weight:600;padding:13px 6px;margin:0}
.ghost{background:none!important;color:var(--mu)!important;margin-top:6px!important}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.row b{display:block;font-size:16px}.row small{color:var(--mu)}.row .go{margin-left:auto;color:var(--mu);font-size:22px}
.add input,.k input{width:100%;padding:13px 14px;border-radius:14px;border:0;background:var(--card);color:var(--tx);font-size:16px;outline:none;margin-bottom:12px}
.empty{text-align:center;color:var(--mu);padding:50px 20px;line-height:1.6}.empty i{font-size:48px;display:block;font-style:normal}
.k{background:var(--card);padding:20px;border-radius:20px;line-height:1.5}.k a{color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button i{font-style:normal;font-size:23px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--ac);font-weight:700}nav button.on i{filter:none;opacity:1}
nav em{position:absolute;top:-2px;right:calc(50% - 24px);background:var(--ac);color:#fff;font-style:normal;font-size:10px;min-width:17px;padding:1px 4px;border-radius:9px}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:30}#sh.on{display:flex}
#sh .s{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sh h3{margin:0 0 12px;text-align:center}#sh .btn{background:var(--bg);color:var(--tx);font-weight:600;margin-bottom:8px}#sh .rm{color:var(--ac)}
#tt{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40}#tt.on{opacity:1;transform:translate(-50%,0)}
.cr{text-align:center;color:var(--mu);font-size:12px;margin-top:24px}.cr a{color:var(--mu)}
.deck{position:relative;height:min(60vh,520px);margin:6px 0 16px}
.card{position:absolute;inset:0;border-radius:26px;background:#444 center/cover no-repeat;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
.card.back{transform:scale(.94) translateY(14px);opacity:.75}
.card .ti{position:absolute;left:0;right:0;bottom:0;padding:90px 18px 16px;background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none}
.card .ti b{display:block;font-size:26px;line-height:1.15;margin-bottom:8px}.card .ti small{opacity:.75;display:block;margin-top:8px}
.card .chip{background:rgba(255,255,255,.2);color:#fff}
.lb{position:absolute;padding:6px 12px;border:3px solid;border-radius:10px;font-weight:800;font-size:18px;opacity:0;background:rgba(0,0,0,.4);pointer-events:none}
.lb.r{top:24px;left:18px;color:#34c759;transform:rotate(-12deg)}.lb.l{top:24px;right:18px;color:#ff453a;transform:rotate(12deg)}
.lb.u{top:24px;left:50%;margin-left:-80px;color:#0a84ff}.lb.d{bottom:130px;left:50%;margin-left:-70px;color:#ff9f0a}
.acts{display:flex;justify-content:center;gap:14px;align-items:flex-start}
.acts button{background:var(--card);border-radius:50%;width:60px;height:60px;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center}
.acts button span{font-size:10px;color:var(--mu);font-weight:600;margin-top:-2px}.acts .un{width:44px;height:44px;font-size:20px;margin-top:8px}
#dv{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:50;display:none}#dv.on{display:block}
#dv .in{max-width:560px;margin:0 auto}
.ph{position:relative}.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:0 0 26px 26px;background:#333}.strip::-webkit-scrollbar{display:none}
.strip img{flex:none;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center}
.seg{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:4px;z-index:2}.seg i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.4)}.seg i.on{background:#fff}
.dx{position:absolute;right:18px;bottom:-24px;width:50px;height:50px;border-radius:50%;background:var(--ac);color:#fff;font-size:22px;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.db{padding:34px 18px 150px}.db h2{font-size:30px;margin:0 0 8px;letter-spacing:-.02em}.db h4{margin:18px 0 6px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.db p{line-height:1.55;font-size:16px;margin:0}.db details{margin-top:12px;color:var(--mu);font-size:14px;line-height:1.5}.db summary{cursor:pointer}
.dbar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:26px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 45%)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:18px;padding:12px 4px 9px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;opacity:.5;font-weight:700;font-size:13px}
.tile.on{opacity:1;box-shadow:0 0 0 3px var(--ac)}.tile.on:after{content:"✓";position:absolute;top:5px;right:8px;font-size:14px}.tile svg{width:100%;max-width:84px}
.avs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.avs button{width:46px;height:46px;border-radius:50%;background:var(--card);font-size:24px;border:3px solid transparent}.avs button.on{border-color:var(--ac)}
.seg2{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:14px}.seg2 button{flex:1;padding:9px 4px;border-radius:10px;background:none;font-size:13px;font-weight:600;color:var(--mu)}.seg2 button.on{background:var(--ac);color:#fff}
.h4{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.hero2{background:var(--card);border-radius:22px;padding:18px;margin-bottom:10px}.big{font-size:46px;font-weight:800;line-height:1}.big small{font-size:18px;color:var(--mu);font-weight:600}
.bar{height:12px;border-radius:6px;background:var(--bg);overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bk{aspect-ratio:3/4;border-radius:12px;background:#444 center/cover;position:relative;overflow:hidden}
.bk span{position:absolute;left:0;right:0;bottom:0;padding:20px 6px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:11px;font-weight:600;line-height:1.2}
</style></head><body>
<div id="v"></div><nav><div id="nav"></div></nav>
<div id="dv"></div><div id="sh"><div class="s" id="shb"></div></div><div id="tt"></div>
<script>
const $=i=>document.getElementById(i);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const SHARED_KEY="01b78bbfe0d5422d972f26178b266c68";/* Clave de RAWG compartida: quien abra la app no tiene que poner la suya */
let KEY=ls.get("rawgkey")||SHARED_KEY,S;try{S=JSON.parse(ls.get("swr1"))}catch(e){}
S=S||{own:[],done:[],save:[]};
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const th=u=>u&&u.includes("/media/games/")?u.replace("/media/","/media/crop/600/400/"):(u||"");
const N={own:"Tengo",done:"Pasados",save:"Guardados"};
const T=[["hoy","🏠","Hoy"],["own","🎮","Tengo"],["done","✅","Pasados"],["save","🔖","Guardados"]];
let tab="hoy",off=0,ctx=null,hG=null,tm,rt=0,sq=0,sres=[];const cache={},det={};
const inLib=id=>["own","done","save"].some(l=>S[l].some(g=>g.id===id));
const delL=(l,id)=>S[l]=S[l].filter(g=>g.id!==id);
const addL=(l,g)=>{if(!S[l].some(x=>x.id===g.id))S[l].unshift(g)};
function api(p,q={}){const u=new URL("https://api.rawg.io/api/"+p);u.searchParams.set("key",KEY);for(const k in q)u.searchParams.set(k,q[k]);return fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})}
const slim=d=>({id:d.id,name:d.name,img:d.background_image||"",genre:(d.genres||[]).map(x=>x.name).slice(0,2).join(" · "),year:(d.released||"").slice(0,4),gs:(d.genres||[]).map(x=>x.slug),tg:(d.tags||[]).filter(t=>t.language==="eng"&&t.games_count<100000).slice(0,8).map(t=>t.slug),rt:d.rating||0,pl:platKey(d)});
function toast(m){const t=$("tt");t.textContent=m;t.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>t.classList.remove("on"),1800)}
function mv(l,g){addL(l,g);if(l!=="save")delL("save",g.id);if(l==="done")addL("own",g);toast("Añadido a "+N[l]);render()}
const closeS=()=>$("sh").classList.remove("on");
function openS(g){ctx={g,from:tab};$("shb").innerHTML=`<h3>${esc(g.name)}</h3>`+Object.keys(N).filter(l=>l!==tab).map(l=>`<button class="btn" data-act="mv" data-l="${l}">Mover a ${N[l]}</button>`).join("")+`<button class="btn rm" data-act="rm">Eliminar de la lista</button><button class="btn" data-act="close">Cancelar</button>`;$("sh").classList.add("on")}
const cvh=(g,k)=>`<div class="cv ${k}" style="background-image:url('${esc(k==="big"?g.img:th(g.img))}')">${g.img?"":"🎮"}${k==="big"?`<div class="ti">${esc(g.name)}</div>`:""}</div>`;
const cr='<div class="cr">Datos e imágenes de <a href="https://rawg.io" target="_blank" rel="noopener">RAWG</a></div>';
function errBox(e){return `<div class="empty"><i>⚠️</i>${String(e.message)==="401"?"La clave de RAWG no es válida.":"No se pudo conectar con RAWG."}<br><br><button class="btn" data-act="key" style="width:auto;padding:12px 22px">Cambiar clave</button></div>`}
async function today(){const day=Math.floor(Date.now()/864e5);let p=day%20+1;
for(let i=0;i<3;i++,p++){if(!cache[p])cache[p]=(await api("games",{platforms:7,ordering:"-added",page_size:40,page:p})).results;const c=cache[p].filter(g=>!inLib(g.id));if(c.length){const g=c[(day*7+off)%c.length];if(!det[g.id])det[g.id]=await api("games/"+g.id);return det[g.id]}}return null}
let LIM;try{LIM=JSON.parse(ls.get("swlim"))}catch(e){}LIM=LIM||{n:0,until:0};let lk;
const saveLim=()=>ls.set("swlim",JSON.stringify(LIM));let MAXD=10;
function lockScreen(){$("v").innerHTML=`<h1>Hasta mañana 🌙</h1><p class="intro">Has visto tus ${MAXD} juegos de hoy. Los siguientes ${MAXD} se desbloquean pasadas 24 horas.</p><div class="empty"><i>⏳</i><div id="cd" style="font-size:44px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums"></div><br>para tus próximos ${MAXD} juegos</div><button class="btn" data-act="tab" data-t="save">Ver mis guardados</button>`+cr;
const tick=()=>{if(!$("cd")){clearInterval(lk);return}const ms=LIM.until-Date.now();if(ms<=0){clearInterval(lk);LIM={n:0,until:0};saveLim();render();return}const x=Math.floor(ms/1e3),p=y=>String(y).padStart(2,"0");$("cd").textContent=`${p(Math.floor(x/3600))}:${p(Math.floor(x%3600/60))}:${p(x%60)}`};tick();lk=setInterval(tick,1000)}
let Q=[],seen=new Set(),pg=0,loading=false,last=null,first=true,busy=false;
const sl=d=>({...slim(d),mc:d.metacritic});
async function fill(){if(loading)return;loading=true;try{const day=Math.floor(Date.now()/864e5);if(!pg)pg=day%20+1;
const r=(await api("games",{platforms:7,ordering:"-added",page_size:40,page:pg})).results;pg++;
let c=r.map(sl).filter(g=>!inLib(g.id)&&!seen.has(g.id)&&!Q.some(q=>q.id===g.id));
if(first&&c.length){const k=(day*7)%c.length;c=c.slice(k).concat(c.slice(0,k));c[0].today=1;first=false}
Q=Q.concat(c)}finally{loading=false}}
async function deckRender(){const v=$("v"),t=++rt,d=new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
if(LIM.until&&Date.now()>=LIM.until){LIM={n:0,until:0};saveLim()}
if(LIM.until>Date.now()){lockScreen();return}
const head=`<div class="dt">${d} · juego ${LIM.n+1} de ${MAXD}</div><h1>Descubre</h1>`;
try{if(!Q.length){v.innerHTML=head+`<div class="empty"><i>⏳</i>Buscando juegos…</div>`;await fill()}else if(Q.length<8)fill().catch(()=>{})}catch(e){if(t===rt)v.innerHTML=head+errBox(e);return}
if(t!==rt||tab!=="hoy")return;
if(!Q.length){v.innerHTML=head+`<div class="empty"><i>🎉</i>No quedan juegos por ahora.</div>`;return}
const g=Q[0],n=Q[1];Q.slice(1,3).forEach(x=>{if(x.img)new Image().src=x.img});
const chips=[PN(g.pl),g.genre,g.year,g.mc?"Metacritic "+g.mc:""].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join("");
v.innerHTML=head+`<p class="intro">Desliza: → guardar para descargar · ← no me interesa · ↓ ya lo tengo · ↑ ya me lo pasé. Toca la tarjeta para ver la descripción.</p><div class="deck">${n?`<div class="card back" style="background-image:url('${esc(n.img)}')"></div>`:""}<div class="card" id="tc" style="background-image:url('${esc(g.img)}')"><div class="lb r">🔖 GUARDAR</div><div class="lb l">✕ NO ME INTERESA</div><div class="lb u">✅ YA ME LO PASÉ</div><div class="lb d">🎮 YA LO TENGO</div><div class="ti">${g.today?`<span class="chip">⭐ Juego de hoy</span><br>`:""}<b>${esc(g.name)}</b>${chips}<small>Toca para ver más</small></div></div></div><div class="acts"><button class="un" data-act="undo">↶</button><button data-act="sw" data-d="l">✕<span>No</span></button><button data-act="sw" data-d="u">✅<span>Pasado</span></button><button data-act="sw" data-d="d">🎮<span>Lo tengo</span></button><button data-act="sw" data-d="r">🔖<span>Guardar</span></button></div>`+cr;
const c=$("tc");let sx,sy,dx=0,dy=0,dr=false,mvd=false;
const dir=()=>Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u");
c.onpointerdown=e=>{dr=true;mvd=false;dx=dy=0;sx=e.clientX;sy=e.clientY;c.setPointerCapture(e.pointerId);c.style.transition="none"};
c.onpointermove=e=>{if(!dr)return;dx=e.clientX-sx;dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)mvd=true;c.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;const m=Math.max(Math.abs(dx),Math.abs(dy)),k=dir();c.querySelectorAll(".lb").forEach(l=>l.style.opacity=l.classList.contains(k)?Math.min(m/100,1):0)};
c.onpointerup=()=>{if(!dr)return;dr=false;if(!mvd){openDetail(g);return}
if(Math.max(Math.abs(dx),Math.abs(dy))>100)fly(dir());else{c.style.transition="transform .25s";c.style.transform="";c.querySelectorAll(".lb").forEach(l=>l.style.opacity=0)}};
c.onpointercancel=()=>{dr=false}}
function fly(d){const c=$("tc");if(!c||busy)return;busy=true;const X={r:[1,0],l:[-1,0],u:[0,-1],d:[0,1]}[d];c.style.transition="transform .3s,opacity .3s";c.style.transform=`translate(${X[0]*600}px,${X[1]*800}px) rotate(${X[0]*25}deg)`;c.style.opacity=0;setTimeout(()=>{busy=false;act(d)},280)}
function act(d){const g=Q.shift();if(!g)return;seen.add(g.id);LIM.n++;if(LIM.n>=MAXD)LIM.until=Date.now()+864e5;saveLim();const l={r:"save",l:"skip",d:"own",u:"done"}[d];last={g,l};
if(l==="done"){addL("done",g);addL("own",g)}else if(l!=="skip")addL(l,g);
if(l!=="skip")toast({save:"🔖 Guardado para descargar",own:"🎮 Añadido a Tengo",done:"✅ Añadido a Pasados"}[l]);render()}
function undo(){if(!last)return;const{g,l}=last;if(l==="done"){delL("done",g.id);delL("own",g.id)}else if(l!=="skip")delL(l,g.id);seen.delete(g.id);Q.unshift(g);LIM.n=Math.max(0,LIM.n-1);saveLim();last=null;toast("Deshecho");render()}
const shots={};
const cut=(t,n)=>{if(t.length<=n)return t;const s=t.slice(0,n),i=s.lastIndexOf(". ");return i>150?s.slice(0,i+1):s.replace(/\s\S*$/,"")+"…"};
async function toEs(id,text){const k="es_"+id,c=ls.get(k);if(c)return c;
const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=en|es"),j=await r.json(),t=j.responseData&&j.responseData.translatedText;
if(!t||j.responseStatus!=200||/MYMEMORY|QUERY LENGTH/i.test(t))throw new Error("tr");ls.set(k,t);return t}
function closeDetail(){$("dv").classList.remove("on");document.body.style.overflow=""}
async function openDetail(g){const o=$("dv");o.classList.add("on");document.body.style.overflow="hidden";o.scrollTop=0;
o.innerHTML=`<div class="empty" style="padding-top:40vh"><i>⏳</i>Cargando…</div>`;let x,sh;
try{[x,sh]=await Promise.all([det[g.id]||api("games/"+g.id),shots[g.id]||api("games/"+g.id+"/screenshots")]);det[g.id]=x;shots[g.id]=sh}catch(e){o.innerHTML=`<div class="in">${errBox(e)}<button class="btn" data-act="dx" style="margin:0 18px;width:calc(100% - 36px)">Cerrar</button></div>`;return}
const imgs=[...new Set([x.background_image,...(sh.results||[]).map(r=>r.image),x.background_image_additional].filter(Boolean))].slice(0,8);

function retoView(v){const Y=YR(),G=goalY(),mine=S.done.filter(g=>g.y===Y),n=mine.length;
let h=`<div class="dt">Reto anual</div><h1>🏆 ${Y}</h1>`;
if(!G)h+=`<p class="intro">¿Cuántos juegos te quieres pasar este año? Puedes cambiarlo cuando quieras.</p><div class="seg2">${[5,10,12,20,30,50].map(x=>`<button data-act="goal" data-v="${x}">${x}</button>`).join("")}</div><input id="gi" type="number" min="1" max="500" placeholder="Otro número" ${inp}><button class="btn" data-act="goalc">Fijar reto</button>`;
else{const doy=Math.floor((Date.now()-new Date(Y,0,0))/864e5),diff=Math.round(n-G*doy/365);
h+=`<div class="hero2"><div class="big">${n}<small> / ${G}</small></div><div class="bar"><i style="width:${Math.min(100,Math.round(n/G*100))}%"></i></div><p style="margin:0;color:var(--mu)">${n>=G?"¡Reto cumplido! 🎉":diff===0?"Vas justo en el ritmo.":diff>0?`Vas ${diff} por delante del ritmo.`:`Vas ${-diff} por detrás del ritmo.`}</p></div><button class="btn ghost" data-act="goalr" style="margin:0 0 6px">Cambiar objetivo</button>`}
h+=`<h4 class="h4">Mis pasados de ${Y}</h4>`+(n?`<div class="shelf">${mine.map(g=>`<div class="bk" style="background-image:url('${esc(th(g.img))}')"><span>${esc(g.name)}</span></div>`).join("")}</div>`:`<p class="intro">Aún no has marcado ningún juego como pasado este año. Desliza ↑ en una tarjeta o añádelo en Biblioteca → Pasados.</p>`);
const ents=[{n:P.name,a:P.av,c:n,g:G,me:1}].concat(P.fr.map(f=>({n:f.n,a:f.a,c:f.d.filter(x=>x.y===Y).length,g:(f.g||{})[Y]||0,t:f.t}))).sort((a,b)=>b.c-a.c);
h+=`<h4 class="h4">Clasificación con amigos</h4>`+(P.fr.length?ents.map((e,i)=>`<div class="row" style="${e.me?"outline:2px solid var(--ac)":""}"><b style="width:30px;font-size:20px;flex:none">${["🥇","🥈","🥉"][i]||i+1}</b><div class="cv sm" style="background:var(--bg);width:46px;height:46px;font-size:26px">${e.a}</div><div><b>${esc(e.n)}${e.me?" (tú)":""}</b><small>${e.c}${e.g?" de "+e.g:""} juego${e.c===1?"":"s"}${e.t?" · "+ago(e.t):""}</small></div></div>`).join("")+`<p class="intro">Los datos de tus amigos son los del último enlace que te enviaron. Pídeles que lo compartan de nuevo para actualizarlos.</p>`:`<div class="empty"><i>👥</i>Añade amigos en la pestaña Amigos y compite con ellos.</div>`);
v.innerHTML=h+cr}
/* vistas */
const row=(g,a,i,ic)=>`<button class="row" data-act="${a}" data-i="${i}">${cvh(g,"sm")}<div><b>${esc(g.name)}</b><small>${esc([PN(g.pl),g.genre,g.year].filter(Boolean).join(" · "))}</small></div><span class="go">${ic}</span></button>`;
const tile=(c,on)=>`<button class="tile ${on?"on":""}" data-act="ctog" data-k="${c.k}" style="background:linear-gradient(145deg,${c.c[0]},${c.c[1]})"><svg viewBox="0 0 100 70">${c.s}</svg>${c.n}</button>`;
const inp='style="width:100%;padding:13px 14px;border-radius:14px;border:0;background:var(--card);color:var(--tx);font-size:16px;margin-bottom:10px;outline:none"';
function plist(f,own){const L=listOf(f,fseg);return`<div class="seg2"><button class="${fseg==="pl"?"on":""}" data-act="fseg" data-v="pl">Tiene ${f.d.length+f.o.length}</button><button class="${fseg==="d"?"on":""}" data-act="fseg" data-v="d">Pasados ${f.d.length}</button></div>`+(L.length?L.map((g,i)=>row(g,own?"fsave":"none",i,own?"🔖":"")).join(""):`<div class="empty">Nada por aquí.</div>`)}
function render(){clearInterval(lk);S.done.forEach(g=>{if(!g.y)g.y=new Date().getFullYear()});saveP();const v=$("v"),nv=$("nav");
if(SV){nv.innerHTML="";v.innerHTML=`<div class="dt">Perfil compartido</div><h1>${SV.a} ${esc(SV.n)}</h1>`+plist(SV,!!P.name)+`<button class="btn" data-act="svadd" style="margin-top:12px">${P.name?"➕ Añadir a mis amigos":"Crear mi perfil y añadirlo"}</button><button class="btn ghost" data-act="svx">Cerrar</button>`+cr;return}
if(!KEY){nv.innerHTML="";v.innerHTML=`<h1>🎮 Juegos Diarios</h1><div class="k"><p>Para cargar los juegos con sus portadas necesitas una clave gratuita de RAWG:</p><p>1. Entra en <a href="https://rawg.io/apidocs" target="_blank" rel="noopener">rawg.io/apidocs</a> y crea tu cuenta.<br>2. Copia tu API key y pégala aquí.</p><input id="kk" placeholder="Tu API key de RAWG" autocapitalize="off" autocorrect="off"><button class="btn" data-act="savekey">Guardar y empezar</button></div>`+cr;return}
if(!P.name){nv.innerHTML="";v.innerHTML=`<h1>🎮 Crea tu perfil</h1><p class="intro">Elige tu nombre y las consolas que tienes. Solo te recomendaré juegos de ellas, y podrás añadir más cuando quieras.</p><input id="pn" placeholder="Tu nombre" maxlength="24" ${inp}><div class="avs">${AV.map(a=>`<button class="${a===dav?"on":""}" data-act="av" data-v="${a}">${a}</button>`).join("")}</div><h4 class="h4">¿Qué consolas tienes?</h4><div class="grid">${C.map(c=>tile(c,draft.includes(c.k))).join("")}</div><button class="btn" data-act="obgo" style="margin-top:18px">Empezar</button>`+cr;return}
const lib=["own","done","save"].includes(tab);
nv.innerHTML=[["hoy","🔥","Descubrir"],["own","📚","Biblioteca"],["reto","🏆","Reto"],["fr","👥","Amigos"],["me","👤","Yo"]].map(([k,i,n])=>`<button class="${(k==="own"?lib:tab===k)?"on":""}" data-act="tab" data-t="${k}"><i>${i}</i>${n}</button>`).join("");
if(tab==="hoy"){deckRender();return}
if(lib){const L=S[tab];v.innerHTML=`<h1>Biblioteca</h1><div class="seg2">${["own","done","save"].map(k=>`<button class="${tab===k?"on":""}" data-act="tab" data-t="${k}">${N[k]} ${S[k].length}</button>`).join("")}</div><div class="add"><input id="n" placeholder="Buscar un juego para añadir…" autocomplete="off"></div><div id="sr"></div>`+(L.length?L.map((g,i)=>row(g,"row",i,"⋯")).join(""):`<div class="empty"><i>📚</i>Nada por aquí todavía.</div>`)+cr;
$("n").oninput=e=>{clearTimeout(sq);const q=e.target.value.trim();if(q.length<2){$("sr").innerHTML="";return}sq=setTimeout(()=>{sget(q).then(r=>{sres=r;if($("n").value.trim()!==q)return;$("sr").innerHTML=sres.length?sres.map((g,i)=>row(g,"pick2",i,"＋")).join(""):`<div class="empty">Sin resultados.</div>`}).catch(e=>{$("sr").innerHTML=errBox(e)})},350)};return}
if(tab==="reto"){retoView(v);return}
if(tab==="fr"){const f=FV&&P.fr.find(x=>x.u===FV);
if(f){v.innerHTML=`<button class="btn ghost" data-act="fback" style="text-align:left;margin:0">‹ Amigos</button><h1>${f.a} ${esc(f.n)}</h1>`+plist(f,true)+`<button class="btn ghost" data-act="fdel" data-u="${f.u}">Eliminar amigo</button>`;return}
v.innerHTML=`<h1>Amigos</h1><p class="intro">Comparte tu enlace para que tus amigos vean tus juegos y los que te has pasado. Pega aquí el suyo para ver los suyos.</p><button class="btn" data-act="share">📤 Compartir mi perfil</button><div class="add"><input id="fl" placeholder="Pega el enlace de un amigo" autocapitalize="off"></div><button class="btn" data-act="addf" style="background:var(--card);color:var(--tx)">Añadir amigo</button>`+P.fr.map(f=>`<button class="row" data-act="fopen" data-u="${f.u}"><div class="cv sm" style="background:var(--bg);width:52px;font-size:28px">${f.a}</div><div><b>${esc(f.n)}</b><small>${f.o.length+f.d.length} juegos · ${f.d.length} pasados</small></div><span class="go">›</span></button>`).join("")+(P.fr.length?"":`<div class="empty"><i>👥</i>Aún no tienes amigos añadidos.</div>`)+cr;return}
const top=Object.entries(P.w).filter(([k,x])=>k[0]==="g"&&x>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k])=>k.slice(2).replace(/-/g," "));
v.innerHTML=`<div class="dt">Mi perfil</div><h1>${P.av} ${esc(P.name)}</h1><p class="intro">${S.own.length} juegos · ${S.done.length} pasados · ${S.save.length} guardados</p><h4 class="h4">Mis consolas</h4><div class="grid">${C.map(c=>tile(c,P.consoles.includes(c.k))).join("")}</div><p class="intro" style="margin-top:8px">Pulsa para añadir o quitar consolas. Las que se incluyan en futuras versiones de la app aparecerán aquí.</p><h4 class="h4">Juegos al día</h4><div class="seg2">${[50,75,100].map(n=>`<button class="${P.cap===n?"on":""}" data-act="cap" data-v="${n}">${n}</button>`).join("")}</div><h4 class="h4">Lo que he aprendido de ti</h4><p class="intro">${top.length?"Te gustan: "+top.join(", ")+". Te enseñaré más juegos así.":"Guarda juegos o márcalos como tuyos y pasados, y empezaré a enseñarte juegos parecidos."}</p><button class="btn" data-act="share">📤 Compartir mi perfil</button><button class="btn ghost" data-act="key">Cambiar clave de RAWG</button>`+cr}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,d=b.dataset;
if(a==="ctog"){const k=d.k;if(!P.name){draft=draft.includes(k)?draft.filter(x=>x!==k):draft.concat(k);b.classList.toggle("on")}else{const has=P.consoles.includes(k);if(has&&P.consoles.length===1){toast("Necesitas al menos una consola");return}P.consoles=has?P.consoles.filter(x=>x!==k):P.consoles.concat(k);Q=[];render()}}
else if(a==="av"){dav=d.v;document.querySelectorAll(".avs button").forEach(x=>x.classList.toggle("on",x.dataset.v===dav))}
else if(a==="obgo"){const n=$("pn").value.trim();if(!n||!draft.length){toast("Pon tu nombre y elige al menos una consola");return}P.name=n;P.av=dav;P.consoles=draft;if(pend){addFriend(pend);pend=null}render()}
else if(a==="cap"){P.cap=MAXD=+d.v;render()}
else if(a==="share")shareMe();
else if(a==="addf"){const t=$("fl").value.trim();try{addFriend(await dec(t.includes("#p=")?t.split("#p=")[1]:t));toast("Amigo añadido");render()}catch(x){toast("Enlace no válido")}}
else if(a==="fopen"){FV=d.u;fseg="pl";render()}else if(a==="fback"){FV=null;render()}
else if(a==="fdel"){P.fr=P.fr.filter(f=>f.u!==d.u);FV=null;render()}
else if(a==="fseg"){fseg=d.v;render()}
else if(a==="fsave"){const f=SV||P.fr.find(x=>x.u===FV),g=listOf(f,fseg)[+d.i];if(g){addL("save",g);learn(g,2);toast("🔖 Guardado en tu biblioteca")}}
else if(a==="svadd"){if(!P.name){pend=SV;SV=null;render()}else{addFriend(SV);SV=null;tab="fr";FV=null;render()}}
else if(a==="svx"){SV=null;render()}
else if(a==="pick2"){const g=sres[+d.i];addL(tab,g);if(tab==="done")addL("own",g);learn(g,tab==="done"?3:2);toast("Añadido a "+N[tab]);render()}
else if(a==="yr"){ctx.g.y=+d.y;closeS();render()}
else if(a==="goal")setGoal(+d.v);else if(a==="goalc")setGoal(+$("gi").value);else if(a==="goalr"){P.goals=P.goals||{};delete P.goals[YR()];render()}
else if(a==="savekey")ready=resolveIds().catch(()=>{})});
if(location.hash.startsWith("#p=")){dec(location.hash.slice(3)).then(f=>{SV=f;fseg="pl";history.replaceState(null,"",location.pathname);render()}).catch(()=>{})}
render();
</script>
</body></html>
