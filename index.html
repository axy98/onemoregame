<div id="dv"></div><div id="mt"></div><div id="sh"><div class="s" id="shb"></div></div><div id="tt"></div>
<script>
const $=i=>document.getElementById(i);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const SHARED_KEY="01b78bbfe0d5422d972f26178b266c68";/* Clave de RAWG compartida: quien abra la app no tiene que poner la suya */
let KEY=ls.get("rawgkey")||SHARED_KEY,S;try{S=JSON.parse(ls.get("swr1"))}catch(e){}
S=S||{own:[],done:[],save:[]};
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const th=u=>u&&u.includes("/media/games/")?u.replace("/media/","/media/crop/600/400/"):(u||"");
const N={own:"Tengo",done:"Pasados",save:"Guardados"};
const T=[["hoy","🏠","Hoy"],["own","🎮","Tengo"],["done","✅","Pasados"],["save","🔖","Guardados"]];
let tab="hoy",off=0,ctx=null,hG=null,tm,rt=0,sq=0,sres=[];const cache={},det={};
const inLib=id=>["own","done","save"].some(l=>S[l].some(g=>g.id===id));
const delL=(l,id)=>S[l]=S[l].filter(g=>g.id!==id);
const addL=(l,g)=>{if(!S[l].some(x=>x.id===g.id))S[l].unshift(g)};
function api(p,q={}){const u=new URL("https://api.rawg.io/api/"+p);u.searchParams.set("key",KEY);for(const k in q)u.searchParams.set(k,q[k]);return fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})}
const slim=d=>({id:d.id,name:d.name,img:d.background_image||"",genre:(d.genres||[]).map(x=>x.name).slice(0,2).join(" · "),year:(d.released||"").slice(0,4),gs:(d.genres||[]).map(x=>x.slug),tg:(d.tags||[]).filter(t=>t.language==="eng"&&t.games_count<100000).slice(0,8).map(t=>t.slug),rt:d.rating||0,pl:platKey(d)});
function toast(m){const t=$("tt");t.textContent=m;t.classList.add("on");clearTimeout(tm);tm=setTimeout(()=>t.classList.remove("on"),1800)}
function mv(l,g){addL(l,g);if(l!=="save")delL("save",g.id);if(l==="done")addL("own",g);toast("Añadido a "+N[l]);render()}
const closeS=()=>$("sh").classList.remove("on");
function openS(g){ctx={g,from:tab};$("shb").innerHTML=`<h3>${esc(g.name)}</h3>`+Object.keys(N).filter(l=>l!==tab).map(l=>`<button class="btn" data-act="mv" data-l="${l}">Mover a ${N[l]}</button>`).join("")+`<button class="btn rm" data-act="rm">Eliminar de la lista</button><button class="btn" data-act="close">Cancelar</button>`;$("sh").classList.add("on")}
const cvh=(g,k)=>`<div class="cv ${k}" style="background-image:url('${esc(k==="big"?g.img:th(g.img))}')">${g.img?"":"🎮"}${k==="big"?`<div class="ti">${esc(g.name)}</div>`:""}</div>`;
const cr='<div class="cr">Datos e imágenes de <a href="https://rawg.io" target="_blank" rel="noopener">RAWG</a></div>';
function errBox(e){return `<div class="empty"><i>⚠️</i>${String(e.message)==="401"?"La clave de RAWG no es válida.":"No se pudo conectar con RAWG."}<br><br><button class="btn" data-act="key" style="width:auto;padding:12px 22px">Cambiar clave</button></div>`}
async function today(){const day=Math.floor(Date.now()/864e5);let p=day%20+1;
for(let i=0;i<3;i++,p++){if(!cache[p])cache[p]=(await api("games",{platforms:7,ordering:"-added",page_size:40,page:p})).results;const c=cache[p].filter(g=>!inLib(g.id));if(c.length){const g=c[(day*7+off)%c.length];if(!det[g.id])det[g.id]=await api("games/"+g.id);return det[g.id]}}return null}
let LIM;try{LIM=JSON.parse(ls.get("swlim"))}catch(e){}LIM=LIM||{n:0,until:0};let lk;
const saveLim=()=>ls.set("swlim",JSON.stringify(LIM));let MAXD=10;
function lockScreen(){$("v").innerHTML=`<h1>Hasta mañana 🌙</h1><p class="intro">Has visto tus ${MAXD} juegos de hoy. Los siguientes ${MAXD} se desbloquean pasadas 24 horas.</p><div class="empty"><i>⏳</i><div id="cd" style="font-size:44px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums"></div><br>para tus próximos ${MAXD} juegos</div><button class="btn" data-act="tab" data-t="save">Ver mis guardados</button>`+cr;
const tick=()=>{if(!$("cd")){clearInterval(lk);return}const ms=LIM.until-Date.now();if(ms<=0){clearInterval(lk);LIM={n:0,until:0};saveLim();render();return}const x=Math.floor(ms/1e3),p=y=>String(y).padStart(2,"0");$("cd").textContent=`${p(Math.floor(x/3600))}:${p(Math.floor(x%3600/60))}:${p(x%60)}`};tick();lk=setInterval(tick,1000)}
let Q=[],seen=new Set(),pg=0,loading=false,last=null,first=true,busy=false;
const sl=d=>({...slim(d),mc:d.metacritic});
async function fill(){if(loading)return;loading=true;try{const day=Math.floor(Date.now()/864e5);if(!pg)pg=day%20+1;
const r=(await api("games",{platforms:7,ordering:"-added",page_size:40,page:pg})).results;pg++;
let c=r.map(sl).filter(g=>!inLib(g.id)&&!seen.has(g.id)&&!Q.some(q=>q.id===g.id));
if(first&&c.length){const k=(day*7)%c.length;c=c.slice(k).concat(c.slice(0,k));c[0].today=1;first=false}
Q=Q.concat(c)}finally{loading=false}}
async function deckRender(){const v=$("v"),t=++rt,d=new Date().toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
if(LIM.until&&Date.now()>=LIM.until){LIM={n:0,until:0};saveLim()}
if(LIM.until>Date.now()){lockScreen();return}
const head=`<div class="dt">${d} · juego ${LIM.n+1} de ${MAXD}</div><h1>Descubre</h1>`;
try{if(!Q.length){v.innerHTML=head+`<div class="empty"><i>⏳</i>Buscando juegos…</div>`;await fill()}else if(Q.length<8)fill().catch(()=>{})}catch(e){if(t===rt)v.innerHTML=head+errBox(e);return}
if(t!==rt||tab!=="hoy")return;

function evict(){const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(CP)){let e=0;try{e=JSON.parse(localStorage.getItem(k)).e}catch(x){}ks.push([k,e])}}ks.sort((a,b)=>a[1]-b[1]);ks.slice(0,Math.ceil(ks.length/3)+1).forEach(([k])=>localStorage.removeItem(k))}
function cset(k,v,ttl){const s=JSON.stringify({v,e:Date.now()+ttl});try{localStorage.setItem(CP+k,s)}catch(e){try{evict();localStorage.setItem(CP+k,s)}catch(x){}}}
